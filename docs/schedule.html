<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TV Schedule</title>
  <!-- the TV Schedule is now a panel on the map page; keep old links working -->
  <script>
    const t = (location.hash.match(/team=([A-Z]{3})/) || [])[1];
    location.replace(`./#tv=${t || "1"}`);
  </script>
  <noscript><meta http-equiv="refresh" content="0; url=./#tv=1"></noscript>
</head>
<body>
  <p>The TV Schedule has moved to the <a href="./#tv=1">map page</a>.</p>
</body>
</html>
