name: NBA schedule

# Fetches the regular-season schedule and national broadcasters from cdn.nba.com
# (via its S3 mirror; the CDN blocks runners) and commits data/schedule.csv to the branch it
# runs on. Weekly, since national TV picks change and NBA Cup games are added in December.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * 1"
  push:
    paths:
      - .github/workflows/schedule.yml
      - scripts/fetch_schedule.py

permissions:
  contents: write

concurrency:
  group: schedule-${{ github.ref }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/fetch_schedule.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/schedule.csv docs/data/schedule.json
          git commit -m "Update the NBA regular-season schedule" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
