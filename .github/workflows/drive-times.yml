name: Drive times

# Computes drive times from every ZIP to its closest arenas with the
# OpenRouteService Matrix API and commits data/drive_times.csv. Needs the
# repository secret ORS_API_KEY. The free plan's daily quota covers about
# half the ZIPs, so it also runs daily and resumes where it left off; once
# every ZIP is done, those runs make no API calls. The site JSON picks up the
# new CSV on the Blackout lookup workflow's next rebuild (re-run that workflow
# to publish right away).
on:
  workflow_dispatch:
    inputs:
      max_requests:
        description: Max API requests this run (free plan allows 500/day)
        default: "450"
  schedule:
    - cron: "17 7 * * *"   # daily, after ORS's quota resets
  push:
    paths:
      - .github/workflows/drive-times.yml
      - scripts/drive_times.py

permissions:
  contents: write

concurrency:
  group: drive-times-${{ github.ref }}

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ORS_API_KEY: ${{ secrets.ORS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: Check the API key is set
        run: |
          [ -n "$ORS_API_KEY" ] || { echo "::error::Add the repository secret ORS_API_KEY (Settings → Secrets and variables → Actions)"; exit 1; }

      - run: python scripts/drive_times.py --max-requests "${{ inputs.max_requests || '450' }}"

      - name: Commit
        # also after a failure part-way, so finished ZIPs aren't redone
        if: always() && hashFiles('data/drive_times.csv') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/drive_times.csv
          git commit -m "Update drive times: $(awk -F, 'NR>1 && $2!=""' data/drive_times.csv | wc -l) ZIPs routed" || exit 0
          for i in 1 2 3; do git pull --rebase origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME" && exit 0; sleep 5; done
          exit 1
